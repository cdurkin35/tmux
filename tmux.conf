# ~/.tmux.conf  (requires tmux 3.2+; check with `tmux -V`)
# Reload with: prefix + r

# ---------- Prefix ----------
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix       # press Ctrl-Space twice to send a literal Ctrl-Space

# ---------- Basics ----------
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10          # snappy Esc in Vim
set -g focus-events on
set -g aggressive-resize on
set -g display-time 2000
set -g repeat-time 600
set -g base-index 1             # windows start at 1
setw -g pane-base-index 1       # panes start at 1
set -g renumber-windows on
set -g set-clipboard on         # OSC 52 clipboard (iTerm2, kitty, WezTerm, Windows Terminal...)
setw -g mode-keys vi

# ---------- Colors (true color) ----------
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
# Advertise true color to programs in panes. Without this, Neovim probes the
# terminal with DCS queries that tmux 3.4 misreads as a sixel image and shows
# as a "SIXEL IMAGE (1x1)" placeholder on startup.
set-environment -g COLORTERM truecolor

# ---------- Reload ----------
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# ---------- Splits and windows (keep current directory) ----------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# ---------- Pane navigation and resizing ----------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Alt+arrows: switch panes without the prefix
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Shift+arrows: switch windows without the prefix
bind -n S-Left  previous-window
bind -n S-Right next-window

# ---------- Copy mode (vi style) ----------
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
# If tmux-yank or OSC 52 does not reach your clipboard, use ONE of these instead:
# bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"                      # macOS
# bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"                     # Wayland
# bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard"  # X11
# bind -T copy-mode-vi y send -X copy-pipe-and-cancel "clip.exe"                    # WSL

# ---------- Light blue theme ----------
# Palette:  bar #a8d8f0 (light sky blue)   text #1b3a57 (deep navy)
#           accent #5aa9d6 (medium blue)    highlight #1b3a57 on #e6f4fb
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#a8d8f0,fg=#1b3a57"

# Left: session name in a darker blue block
set -g status-left-length 30
set -g status-left "#[bg=#5aa9d6,fg=#ffffff,bold]  #S #[bg=#a8d8f0,fg=#1b3a57,nobold]  "

# Right: prefix indicator, host, date, time
set -g status-right-length 80
set -g status-right "#{?client_prefix,#[bg=#f2c94c#,fg=#1b3a57#,bold]  PREFIX  #[default] ,}#[fg=#1b3a57] #{host_short}  #[fg=#3b6a8f]|#[fg=#1b3a57]  %a %d %b  #[bg=#5aa9d6,fg=#ffffff,bold]  %H:%M "

# Window list
set -g window-status-separator ""
set -g window-status-format         "  #I #W  "
set -g window-status-style          "bg=#a8d8f0,fg=#3b6a8f"
set -g window-status-current-format "  #I #W#{?window_zoomed_flag, [Z],}  "
set -g window-status-current-style  "bg=#e6f4fb,fg=#1b3a57,bold"
set -g window-status-activity-style "bg=#a8d8f0,fg=#c0392b,bold"
set -g window-status-bell-style     "bg=#c0392b,fg=#ffffff,bold"

# Pane borders, messages, copy-mode selection
set -g pane-border-style        "fg=#7fb6d6"
set -g pane-active-border-style "fg=#5aa9d6,bold"
set -g message-style            "bg=#e6f4fb,fg=#1b3a57,bold"
set -g message-command-style    "bg=#e6f4fb,fg=#1b3a57"
set -g mode-style               "bg=#5aa9d6,fg=#ffffff"

# ---------- Popup shell (tmux 3.2+): prefix + g ----------
bind g display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "$SHELL"

# ---------- Plugins (TPM) ----------
# Install TPM first:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Then press prefix + I to install the plugins below.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# Keep this line at the very bottom of the file
run '~/.tmux/plugins/tpm/tpm'
